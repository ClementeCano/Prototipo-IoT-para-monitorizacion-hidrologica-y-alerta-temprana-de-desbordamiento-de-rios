# fly.toml app configuration file generated for dashboard-ebro on 2026-04-29T10:03:14+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dashboard-ebro'
primary_region = 'cdg'

[build]

[env]
  DATA_DIR = "/data"
  USERS_FILE = "/data/users.json"
  TOKENS_FILE = "/data/tokens.json"
  PREDICTIONS_FILE = "/data/predictions.json"
  SESSION_COOKIE_SECURE = "1"
  USER_STORE_BACKEND = "auto"
  PREDICTION_STORE_BACKEND = "auto"
  PREDICTION_EVAL_LOOKBACK_DAYS = "30"
  PREDICTION_EVAL_CHECK_SECONDS = "3600"
  PREDICTION_EVAL_INCLUDE_TODAY = "1"
  PREDICTION_EVAL_MIN_REFRESH_SECONDS = "600"
  PREDICTION_DAILY_REFRESH_ENABLED = "1"
  PREDICTION_DAILY_REFRESH_HOUR = "6"
  PREDICTION_DAILY_REFRESH_MINUTE = "0"
  PREDICTION_DAILY_CHECK_SECONDS = "600"
  PREDICTION_DAILY_STARTUP_GRACE_SECONDS = "1800"
  PREDICTION_USE_LIVE_SAIH = "1"
  PREDICTION_LIVE_SAIH_LOOKBACK_DAYS = "21"
  PREDICTION_LIVE_SAIH_CACHE_SECONDS = "1800"
  MIGRATE_USERS_JSON_ON_START = "1"
  SAIH_SSL_MODE = "auto"
  PUBLIC_BASE_URL = "https://dashboard-ebro.fly.dev"
  ALERT_HOUR = "12"
  ALERT_MINUTE = "17"
  ALERT_CHECK_SECONDS = "5"
  ALERT_TIMEZONE = "Europe/Madrid"
  CUDA_VISIBLE_DEVICES = "-1"
  TF_CPP_MIN_LOG_LEVEL = "2"

[[mounts]]
  source = "tokens_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 20
    hard_limit = 25

[[vm]]
  memory = "2gb"
  cpus = 2
  memory_mb = 2048

[checks]

  [checks.alive]
    type = "http"
    port = 8080
    method = "get"
    path = "/health"
    interval = "15s"
    timeout = "10s"
    grace_period = "90s"
